name: Upload due Shorts to YouTube

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no upload)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r uploader/requirements.txt

      - name: Upload due videos
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python uploader/upload.py --dry-run
          else
            python uploader/upload.py --max 3
          fi

      - name: Save upload record
        if: always()
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add state
            git commit -m "Record uploaded Shorts [skip ci]"
            git push
          fi
